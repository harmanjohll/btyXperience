<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Beatty Experience — Set Sail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="app.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="antialiased">
    <div id="app" class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4 pb-12"></div>
    <!-- Persistent "your boat" companion: tucked in the corner while you answer
         questions, growing fold by fold as the session goes. Lives outside #app
         so page transitions never wipe it. -->
    <div id="cornerBoat" class="corner-boat" hidden aria-label="Your folded boat so far"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
