<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000C53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hive Rush</title>
<link rel="icon" href="crest.png">
<link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/hive.css">

<body class="player">
<div class="bg" aria-hidden="true"><div class="bg-hex"></div><div class="bg-glow"></div><div class="bg-glow b"></div></div>
<main id="app"></main>
<button class="exit-hold" id="exitHold" aria-label="Beatty crest"><img src="crest.png" alt=""></button>

<script src="js/content.js"></script>
<script src="js/fx.js"></script>
<script src="js/rounds.js"></script>
<script src="js/engine.js"></script>
